version: '3.8'

services:
  frontend:
    image: acrnyagahfee.azurecr.io/karani-frontend:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend
      - payment-gateway

  payment-gateway:
    image: acrnyagahfee.azurecr.io/karani-payment-gateway:${IMAGE_TAG:-latest}
    expose:
      - "8000"
    environment:
      - SUPABASE_URL
      - SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - PAYSTACK_SECRET_KEY
    restart: always

  backend:
    image: acrnyagahfee.azurecr.io/karani-backend:latest
    expose:
      - "8000"
    environment:
      - PORT=8000
      - APP_ENV=production
      - CORS_ORIGINS=https://nyagahkithinji-advocates.azurewebsites.net,https://nyagah-b-fee-notes.azurewebsites.net,http://localhost:3000
      - JWT_SECRET_KEY
      - SUPABASE_URL
      - SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SMTP_FROM=p3lcodes@gmail.com
      - SMTP_USE_TLS=true
    restart: always
