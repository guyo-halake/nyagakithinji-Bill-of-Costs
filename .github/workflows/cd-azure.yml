name: CD Pipeline — Azure Multi-Environment Delivery

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cd-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. PRE-DEPLOYMENT QUALITY GATE
  # ============================================================================
  pre-deploy-verification:
    name: 🛡️ Pre-Deployment Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Verify Backend Statutory Engine
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd backend && PYTHONPATH=. pytest app/tests -v

  # ============================================================================
  # 2. AZURE MULTI-ENVIRONMENT CONTAINER DELIVERY
  # ============================================================================
  deploy-to-azure:
    name: 🚀 Deploy to Microsoft Azure (${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }})
    needs: pre-deploy-verification
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.target_environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
      url: ${{ env.DEPLOYED_APP_URL }}
    env:
      TARGET_ENV: ${{ github.event.inputs.target_environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
      AZURE_REGISTRY_SERVER: ${{ secrets.AZURE_REGISTRY_SERVER }}
      AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Target Environment URLs
        run: |
          if [ "$TARGET_ENV" = "production" ]; then
            echo "ENVIRONMENT_TAG=production" >> $GITHUB_ENV
            echo "DEPLOYED_APP_URL=https://${{ secrets.AZURE_WEBAPP_NAME || 'nyagahkithinji-advocates' }}.azurewebsites.net" >> $GITHUB_ENV
            echo "ACTIVE_WEBAPP=${{ secrets.AZURE_WEBAPP_NAME || 'nyagahkithinji-advocates' }}" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT_TAG=staging" >> $GITHUB_ENV
            echo "DEPLOYED_APP_URL=https://${{ secrets.AZURE_STAGING_WEBAPP_NAME || 'nyagahkithinji-advocates-staging' }}.azurewebsites.net" >> $GITHUB_ENV
            echo "ACTIVE_WEBAPP=${{ secrets.AZURE_STAGING_WEBAPP_NAME || 'nyagahkithinji-advocates-staging' }}" >> $GITHUB_ENV
          fi

      - name: Log in to Azure Container Registry (ACR)
        if: env.AZURE_REGISTRY_SERVER != ''
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_REGISTRY_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        if: env.AZURE_REGISTRY_SERVER != ''
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Hardened Backend Image to ACR
        if: env.AZURE_REGISTRY_SERVER != ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-backend:${{ github.sha }}
            ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-backend:${{ env.ENVIRONMENT_TAG }}
            ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Optimized Frontend Image to ACR
        if: env.AZURE_REGISTRY_SERVER != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          tags: |
            ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-frontend:${{ github.sha }}
            ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-frontend:${{ env.ENVIRONMENT_TAG }}
            ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Multi-Container Deployment Spec
        run: |
          sed -i "s|\${IMAGE_TAG:-latest}|${{ github.sha }}|g" ./azure/docker-compose.azure.yml
          sed -i "s|\${AZURE_REGISTRY_SERVER:-acrnyagahfee.azurecr.io}|${{ secrets.AZURE_REGISTRY_SERVER }}|g" ./azure/docker-compose.azure.yml

      - name: Deploy to Azure Web App for Containers
        if: env.AZURE_WEBAPP_NAME != ''
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.ACTIVE_WEBAPP }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          configuration-file: ./azure/docker-compose.azure.yml

      - name: Post-Deployment Zero-Downtime Health Verification
        run: |
          echo "Verifying deployment health at: $DEPLOYED_APP_URL/api/v1/health"
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$DEPLOYED_APP_URL/api/v1/health" || echo "000")
          echo "Health Check HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Deployment verified healthy on $TARGET_ENV!"
          else
            echo "⚠️ Deployment notification: HTTP status $STATUS. Probe pending application warmup."
          fi
