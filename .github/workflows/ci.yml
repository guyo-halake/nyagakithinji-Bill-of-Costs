name: Frontend CI Quality Gate — React / TypeScript / Vite

on:
  push:
    branches: [ develop, staging, main, Nyaga-*, update-* ]
  pull_request:
    branches: [ develop, staging, main ]
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-verification:
    name: 🎨 Node 20 / TypeScript Compilation & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Typecheck (Zero Errors Allowed)
        run: npx tsc --noEmit

      - name: Production Vite Asset Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hhkbypvdwikxdlwivmrn.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'dummy-anon-key' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://nyagahkithinji-advocates.azurewebsites.net' }}

  frontend-docker-build:
    name: 🐳 Nginx Container Build & Optimization Test
    needs: frontend-verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Optimized Nginx Alpine Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: karani-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
