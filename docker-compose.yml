services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karani-law-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    restart: always

networks:
  default:
    name: karani-frontend-network
